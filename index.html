<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Dashboard – Pinnika Hanumanthu Raju</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#0e7490;--acc2:#4f46e5;--soft:#e6f4f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121c33;--ink:#e6edf7;--mute:#94a3b8;--line:#22314d;--acc:#22d3ee;--acc2:#818cf8;--soft:#16233f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121c33;--ink:#e6edf7;--mute:#94a3b8;--line:#22314d;--acc:#22d3ee;--acc2:#818cf8;--soft:#16233f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#0e7490 100%);color:#fff;border-radius:18px;padding:26px}
.av{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px;font-weight:700;border:2px solid rgba(255,255,255,.5);overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.top h1{margin:0;font-size:26px}.top p{margin:2px 0;opacity:.92}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:rgba(255,255,255,.16);padding:3px 11px;border-radius:99px;font-size:12.5px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{background:#fff;color:#0f172a;border:0;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
button.pri{background:var(--acc);color:#fff}button.ghost{background:var(--soft);color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;margin:16px 0;padding-bottom:4px}
nav a{white-space:nowrap;text-decoration:none;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:13px}
nav a:hover{color:var(--acc);border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-size:28px;color:var(--acc)}.kpi span{color:var(--mute);font-size:12.5px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.actions{margin-left:0}}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:4px;height:16px;background:var(--acc);border-radius:2px}
.sum{color:var(--mute);margin:0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
.job{position:relative;margin-bottom:18px}
.job:before{content:"";position:absolute;left:-25px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.job h3{margin:0;font-size:15px}.job small{color:var(--mute)}
.job ul{margin:6px 0 0;padding-left:18px;color:var(--mute)}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.a{background:var(--soft);border-radius:12px;padding:13px}.a b{display:block;font-size:20px;color:var(--acc2)}.a span{font-size:13px;color:var(--mute)}
.cert{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.cert:last-child{border:0}.cert small{color:var(--mute);display:block}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--acc);white-space:nowrap}
.tag.go{background:rgba(16,185,129,.15);color:#10b981}.tag.file{cursor:pointer}.att{margin-top:6px}.tag.wip{background:rgba(255,170,0,.18);color:#c98400}
.sg{margin-bottom:12px}.sg small{display:block;color:var(--mute);margin-bottom:5px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stack{display:flex;gap:6px;flex-wrap:wrap}
.proj{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.proj h3{margin:0 0 4px;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.proj p{margin:0 0 8px;color:var(--mute);font-size:13.5px}
#ov,#vw{position:fixed;inset:0;background:rgba(5,10,25,.6);display:none;z-index:50;overflow:auto;padding:20px 12px}
#ov.on,#vw.on{display:block}#vw{z-index:60}#vw .modal{max-width:900px}#vwb img{max-width:100%;border-radius:10px;display:block;margin:10px auto}#vwb iframe{width:100%;height:72vh;border:0;border-radius:10px;background:#fff;margin-top:10px}
.cf{padding:9px 0;border-bottom:1px solid var(--line)}.cf b{display:block;font-size:13px;margin-bottom:5px}.cf input{margin-top:6px;font-size:12px}.x{background:none;border:0;color:inherit;padding:0 0 0 4px;cursor:pointer;font-size:12px}
.modal{max-width:760px;margin:0 auto;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--line)}
.modal h2{font-size:18px}.modal label{display:block;font-weight:600;font-size:13px;margin:14px 0 4px}
.modal label small{font-weight:400;color:var(--mute)}
.modal input,.modal textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.modal input{font-family:inherit;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:sticky;bottom:0;background:var(--card);padding:10px 0}
.msg{font-size:12.5px;color:var(--mute);margin-top:8px}
@media print{nav,.actions,.hint,#ov,#vw{display:none!important}body{background:#fff}section,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="av" id="ini"></div>
  <div><h1 id="name"></h1><p id="role"></p><p id="loc"></p><div class="chips" id="contact"></div></div>
  <div class="actions"><button id="print">Download resume (PDF)</button><button id="theme">Theme</button></div>
 </header>
 <nav><a href="#kpis">Overview</a><a href="#exp">Experience</a><a href="#ach">Achievements</a><a href="#proj">Projects</a><a href="#cert">Education</a><a href="#skills">Skills</a></nav>
 <section><h2>Profile summary</h2><p class="sum" id="summary"></p></section>
 <div class="kpis" id="kpis"></div>
 <div class="grid">
  <div>
   <section id="exp"><h2>Experience</h2><div class="tl" id="expList"></div></section>
   <section id="proj"><h2>Key projects</h2><div id="projList"></div></section>
  </div>
  <div>
   <section id="ach"><h2>Achievements</h2><div class="ach" id="achList"></div></section>
   <section id="cert"><h2>Education &amp; certifications</h2><div id="certList"></div></section>
   <section id="skills"><h2>Skills</h2><div id="skillList"></div></section>
  </div>
 </div>
</div>

<div id="vw"><div class="modal"><button class="ghost" id="vwx">Close</button><div id="vwb"></div></div></div>

<script>
const DEFAULT={
 photo:"photo.jpg",certFiles:{},
 name:"Pinnika Hanumanthu Raju",
 role:"RTR Lead Associate",
 company:"Deloitte",
 location:"Andhra Pradesh, India",
 contact:["hanuman.hanu1996@gmail.com","7095657725"],
 summary:"Record to Report (R2R) professional with 6 years of experience in cash accounting, reconciliations, intercompany transactions and month-end close. Experienced in SAP, Oracle and ARCS, handling AP/AR reconciliations, cash journals, balance sheet reporting and audit support, with a focus on accuracy, SLA adherence and timely financial reporting.",
 kpis:[["6 yrs","Finance & accounting experience"],["50%","Journal prep time saved by automation"],["5","Awards & recognitions"],["3","ERP systems: SAP, Oracle, Tally"]],
 experience:[
  {t:"RTR Lead Associate",o:"Deloitte",d:"Sep 2026 – Present",b:[]},
  {t:"Record to Report Ops Analyst",o:"Accenture Solutions Pvt Ltd, Bangalore",d:"Jun 2022 – Sep 2026",b:[
   "Managed daily and monthly cash journal entries (manual and automated) with accuracy and policy compliance",
   "Handled intercompany financing, cash settlements and funding journals with Treasury and intercompany teams",
   "Performed daily, weekly and monthly bank, cash and AP reconciliations of the General Ledger to bank statements",
   "Reconciled monthly credit card (subscription) accounts between merchant banks and the General Ledger",
   "Used the ARCS tool for reconciliations and timely submission for client approvals",
   "Prepared open items reports, cash certifications and month-end close reports, including balance sheet flux analysis",
   "Ran month-end close from WD+01 to WD-00 within SLAs and TATs; supported internal and external audits"]},
  {t:"Accounts Executive",o:"Ganga Kaveri Seeds Pvt Ltd, Hyderabad",d:"Nov 2020 – Jun 2022",b:[
   "Processed timesheets, expense reports and reimbursements in SAP",
   "Recorded cash receipts and vendor payments; performed bank and cash reconciliations in SAP",
   "Supported internal and external audits with SAP documentation and explanations"]}
 ],
 achievements:[["50%","Reduced journal preparation time by implementing an automation bot, improving accuracy"],["Employee of the Month","For consistently high accuracy in financial reporting"],["2× Encore Awards","Exceptional performance in R2R operations"],["2× Client Value Creation","Recognised for outstanding contributions to R2R processes"]],
 projects:[
  {n:"Journal Automation Bot",s:"Automation",p:"Implemented a process automation bot that cut journal preparation time by 50% and improved accuracy.",st:["Process automation","SAP","Oracle"]},
  {n:"Reconciliation & Month-end Close",s:"R2R operations",p:"Bank, cash, AP and credit card reconciliations in ARCS with flux analysis, closed within SLA each month.",st:["Oracle ARCS","Excel","Flux analysis"]}
 ],
 certs:[["MBA, Finance","Krishna Chaitanya Institute of Management, JNTUK","Completed","go"],["BSc, Computers","BSR Degree College, SV University","Completed","go"]],
 skills:[["ERP systems","SAP FI-CO, Oracle, Tally ERP 9"],["Reconciliation","Oracle ARCS"],["Reporting","MS Excel, Word, PowerPoint"],["Automation & analytics","ChatGPT, Process automation bots"],["Core R2R","Cash accounting, Intercompany, Bank & AP/AR recs, Month-end close, Audit support"]]
};
let D=JSON.parse(JSON.stringify(DEFAULT));
const $=id=>document.getElementById(id),E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sp=(l,n)=>{const p=l.split("|").map(x=>x.trim());while(p.length<n)p.push("");return p};
const lines=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
function render(){
 $("name").textContent=D.name;$("role").textContent=D.role+(D.company?" · "+D.company:"");$("loc").textContent=D.location;
 {const ini=D.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();if(D.photo){$("ini").innerHTML='<img alt="" data-i="'+ini+'" onerror="this.parentNode.textContent=this.dataset.i" src="'+D.photo+'">'}else{$("ini").textContent=ini}}
 $("contact").innerHTML=D.contact.map(c=>'<span class="chip">'+E(c)+'</span>').join("");
 $("summary").textContent=D.summary;
 $("kpis").innerHTML=D.kpis.map(k=>'<div class="kpi"><b>'+E(k[0])+'</b><span>'+E(k[1])+'</span></div>').join("");
 $("expList").innerHTML=D.experience.map(j=>'<div class="job"><h3>'+E(j.t)+'</h3><small>'+E(j.o)+' · '+E(j.d)+'</small><ul>'+j.b.map(x=>'<li>'+E(x)+'</li>').join("")+'</ul></div>').join("");
 $("achList").innerHTML=D.achievements.map(a=>'<div class="a"><b>'+E(a[0])+'</b><span>'+E(a[1])+'</span></div>').join("");
 $("certList").innerHTML=D.certs.map((c,i)=>{const fs=(D.certFiles||{})[c[0]]||[];return '<div class="cert"><div>'+E(c[0])+'<small>'+E(c[1])+'</small>'+(fs.length?'<div class="stack att">'+fs.map((f,j)=>'<span class="tag file" data-i="'+i+'" data-j="'+j+'">📎 '+E(f.n)+'</span>').join("")+'</div>':'')+'</div><span class="tag '+E(c[3])+'">'+E(c[2])+'</span></div>'}).join("");
 $("projList").innerHTML=D.projects.map(p=>'<div class="proj"><h3>'+E(p.n)+'<span class="tag">'+E(p.s)+'</span></h3><p>'+E(p.p)+'</p><div class="stack">'+p.st.map(x=>'<span class="tag">'+E(x)+'</span>').join("")+'</div></div>').join("");
 $("skillList").innerHTML=D.skills.map(s=>'<div class="sg"><small>'+E(s[0])+'</small><div class="stack">'+s[1].split(",").map(x=>'<span class="tag">'+E(x.trim())+'</span>').join("")+'</div></div>').join("");
}
$("print").onclick=()=>window.print();
$("theme").onclick=()=>{const r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
$("certList").addEventListener("click",e=>{const t=e.target.closest(".file");if(!t)return;const f=((D.certFiles||{})[D.certs[t.dataset.i][0]]||[])[t.dataset.j];if(!f)return;const img=(f.t||"").indexOf("image/")===0;$("vwb").innerHTML=(img?'<img alt="" src="'+f.u+'">':'<iframe src="'+f.u+'"></iframe>')+'<div class="msg"><a href="'+f.u+'" target="_blank" rel="noopener">Open in a new tab</a></div>';$("vw").classList.add("on")});
$("vwx").onclick=()=>{$("vw").classList.remove("on");$("vwb").innerHTML=""};
render();
</script>
</body>
</html>
